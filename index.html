<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chevy, the magazine</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Danfo&family=Inter:ital,wght@0,400;0,500;1,400;1,500&display=swap" 
<link href="https://fonts.googleapis.com/css2?family=Danfo&family=Inter:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
rel="stylesheet">
  <style>
/* 1. Top category bar links */
.cat-link {
  font-style: italic;
  text-transform: uppercase;
}

/* 2. Category label on article grid cards */
.card-category {
  font-style: italic;
  text-transform: uppercase;
}

/* 3. Category label inside an open article */
.detail-category {
  font-style: italic;
  text-transform: uppercase;
}

/* 4. "MORE OF CHEVY" title in the footer (Add this in page2, page3, page4, page5 too) */
.footer-links-title {
  font-style: italic;
  text-transform: uppercase;
}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #fffefe;
      color: #1f1b19;
      overflow-x: hidden;
    }

    /* Top Header: CHEVY, THE MAGAZINE */
    .top-header {
      padding: 26px 20px 20px 20px;
      text-align: center;
      border-bottom: 1px solid #1f1b19;
    }
    .header-title {
      font-family: 'Danfo', serif;
      font-size: 62px;
      font-weight: 400;
      line-height: 1;
      color: #1f1b19;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Categories Bar with Vertical Dividers */
    .categories-nav {
      border-bottom: 1px solid #1f1b19;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    .cat-link {
      font-size: 20px;
      font-style: italic;
      font-weight: 400;
      text-transform: uppercase;
      color: #1f1b19;
      text-decoration: none;
      padding: 4px 22px;
      border-right: 1px solid #1f1b19;
      cursor: pointer;
    }
    .cat-link:last-child { border-right: none; }
    .cat-link:hover { text-decoration: underline; }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px 28px 40px 28px;
    }

      }

    /* Newspaper 3-Column Grid (1-Tile vs 2-Tile) */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 195px;
      grid-auto-flow: dense;
    }
    .article-card {
      padding: 18px 22px;
      border-right: 1px solid #1f1b19;
      border-bottom: 1px solid #1f1b19;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      background-color: #fffefe;
      overflow: hidden;
    }
    .card-1tile {
      grid-row: span 1;
      justify-content: center;
    }
    .card-2tile {
      grid-row: span 2;
    }
    .card-category {
      font-size: 17px;
      font-style: italic;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .card-title {
      font-family: 'Danfo', serif;
      font-size: 32px;
      font-weight: 400;
      line-height: 1.05;
      text-transform: uppercase;
      margin-bottom: 6px;
      overflow-wrap: break-word;
    }
    .card-snippet {
      font-size: 17px;
      line-height: 1.35;
      color: #1f1b19;
      overflow-wrap: break-word;
    }
    .card-image {
      width: 100%;
      height: 195px;
      object-fit: cover;
      display: block;
      margin: 6px 0;
    }

    /* Open Article View (Matches 2_3.png) */
    #detail-view {
      display: none;
      width: 100%;
      padding: 10px 0 30px 0;
    }
    .detail-category {
      font-size: 24px;
      font-style: italic;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: left;
    }
    .detail-title {
      font-family: 'Danfo', serif;
      font-size: 56px;
      font-weight: 400;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.05;
      margin-bottom: 8px;
    }
    .detail-author {
      font-size: 18px;
      text-align: center;
      margin-bottom: 20px;
    }
    .detail-image {
      display: block;
      width: 100%;
      max-width: 440px;
      max-height: 360px;
      object-fit: cover;
      margin: 20px auto 32px auto;
    }
    .detail-body {
      font-size: 22px;
      line-height: 1.6;
      text-align: left;
      max-width: 960px;
      margin: 0 auto;
      overflow-wrap: break-word;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-title {
      font-family: 'Danfo', serif;
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .empty-smiley {
      font-family: 'Danfo', serif;
      font-size: 52px;
      font-weight: 400;
    }

    /* Footer (Matches 1.jpg, 2_3.png, 3.png) */
    .site-footer {
      border-top: 1px solid #1f1b19;
      padding: 28px 40px 36px 40px;
      margin-top: auto;
      background-color: #fffefe;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 110px;
      flex-wrap: wrap;
    }
    .footer-logo {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      text-decoration: none;
      color: #1f1b19;
    }
    .footer-logo-sub {
      font-family: 'Danfo', serif;
      font-size: 21px;
      line-height: 1;
      margin-bottom: -5px;
    }
    .footer-logo-main {
      font-family: 'Danfo', serif;
      font-size: 68px;
      line-height: 0.9;
    }
    .footer-links-title {
      font-size: 24px;
      font-style: italic;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .footer-links-grid {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 80px;
      row-gap: 10px;
    }
    .footer-links-grid a {
      font-size: 19px;
      text-transform: uppercase;
      color: #1f1b19;
      text-decoration: none;
    }
    .footer-links-grid a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .articles-grid { grid-template-columns: repeat(2, 1fr); }
      .header-title { font-size: 46px; }
    }
    @media (max-width: 600px) {
      .header-title { font-size: 34px; }
      .cat-link { font-size: 15px; padding: 4px 10px; }
      .articles-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
      .article-card { border-right: none; }
      .card-2tile { grid-row: span 1; }
      .footer-inner { gap: 36px; }
      .footer-links-grid { grid-template-columns: 1fr; row-gap: 8px; }
      .detail-title { font-size: 38px; }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="index.html" class="header-title" onclick="filterArticles('all'); return false;">CHEVY, THE MAGAZINE</a>
  </header>

  <nav id="top-categories-nav" class="categories-nav">
    <a href="#fashion" class="cat-link" onclick="filterArticles('fashion'); return false;">FASHION</a>
    <a href="#entertaiment" class="cat-link" onclick="filterArticles('entertaiment'); return false;">ENTARTAIMENT</a>
    <a href="#art" class="cat-link" onclick="filterArticles('art'); return false;">ART\PHOTO</a>
    <a href="#books" class="cat-link" onclick="filterArticles('books'); return false;">BOOK\POETRY</a>
    <a href="#news" class="cat-link" onclick="filterArticles('news'); return false;">NEWS\POLITICS</a>
    <a href="#culture" class="cat-link" onclick="filterArticles('culture'); return false;">CULTURE</a>
  </nav>

  <main class="main-content">
    <div id="feed-view">
         </div>
      <div id="articles-grid" class="articles-grid">
        <!-- ARTICLES_START -->

        <!-- ARTICLES_END -->
      </div>

      <div id="empty-state" class="empty-state" style="display: block;">
        <h2 class="empty-title">No Articles Yet</h2>
        <div class="empty-smiley">:(</div>
      </div>
    </div>

    <div id="detail-view">
      <div id="detail-content"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-logo" onclick="filterArticles('all'); return false;">
        <span class="footer-logo-sub">,THE MAGAZINE</span>
        <span class="footer-logo-main">CHEVY</span>
      </a>
      <div>
        <div class="footer-links-title">MORE OF CHEVY</div>
        <div class="footer-links-grid">
          <a href="page3.html">ABOUT THE MAGAZINE</a>
          <a href="page5.html">JOIN OUR TEAM</a>
          <a href="page2.html">PUBLISH YOUR ARTICLE</a>
          <a href="page4.html">DONATE</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const magazineNewsData = {
      title: "Chevy has launched!!!",
      text: "After a few months, our 'Chevy' is finally launched! I'm so happy to announce the start of our magazine. To read more and/or ask questions, read the 'About the Magazine' page! We are open to pitches."
    };

    let currentCategory = 'all';

    function openMagazineNews(pushHistory = true) {
      document.getElementById('top-categories-nav').style.display = 'none';
      document.getElementById('feed-view').style.display = 'none';
      document.getElementById('detail-content').innerHTML = `
        <div class="detail-category">NEWS</div>
        <h1 class="detail-title">${magazineNewsData.title}</h1>
        <div class="detail-body">${magazineNewsData.text}</div>
      `;
      document.getElementById('detail-view').style.display = 'block';
      if (pushHistory) history.pushState({ view: 'magazine-news' }, '', '#magazine-news');
      window.scrollTo(0, 0);
    }

    function filterArticles(targetCategory, pushHistory = true) {
      currentCategory = targetCategory.toLowerCase();
      document.getElementById('top-categories-nav').style.display = 'flex';
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('feed-view').style.display = 'block';

      const cards = document.querySelectorAll('.article-card');
      let visibleCount = 0;

      cards.forEach(card => {
        const cardCat = (card.getAttribute('data-category') || '').toLowerCase();
        const isEnt = ['entertaiment', 'entertainment', 'entartaiment'].includes(currentCategory) &&
                      (cardCat.includes('entertaiment') || cardCat.includes('entertainment') || cardCat.includes('entartaiment'));

        if (currentCategory === 'all' || cardCat.includes(currentCategory) || isEnt) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      document.getElementById('empty-state').style.display = (visibleCount === 0) ? 'block' : 'none';
      if (pushHistory) history.pushState({ view: 'feed', category: currentCategory }, '', `#${currentCategory}`);
    }

    function openArticle(title, category, author, image, body) {
      document.getElementById('top-categories-nav').style.display = 'none';
      document.getElementById('feed-view').style.display = 'none';

      const dTitle = decodeURIComponent(title);
      const dCat = decodeURIComponent(category);
      const dAuthor = decodeURIComponent(author);
      const dImg = decodeURIComponent(image);
      const dBody = decodeURIComponent(body);

      document.getElementById('detail-content').innerHTML = `
        <div class="detail-category">${dCat}</div>
        <h1 class="detail-title">${dTitle}</h1>
        ${dAuthor ? `<div class="detail-author">${dAuthor}</div>` : ''}
        ${dImg ? `<img src="${dImg}" class="detail-image" alt="${dTitle}">` : ''}
        <div class="detail-body">${dBody}</div>
      `;

      document.getElementById('detail-view').style.display = 'block';
      history.pushState({ view: 'article' }, '', '#article');
      window.scrollTo(0, 0);
    }

    window.addEventListener('popstate', () => {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (hash === 'magazine-news') openMagazineNews(false);
      else filterArticles(currentCategory, false);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      if (hash === 'magazine-news') openMagazineNews(false);
      else if (['all', 'fashion', 'entertaiment', 'entertainment', 'entartaiment', 'art', 'books', 'book', 'news', 'culture'].includes(hash)) {
        filterArticles(hash, false);
      } else {
        filterArticles('all', false);
      }
    });
  </script>
</body>
</html>
